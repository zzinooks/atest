spring:
  application.name: fgc-backend
  datasource:
    url: ${FGC_DB_URL:jdbc:postgresql://127.0.0.1:5433/fgc}
    username: ${FGC_DB_USER:fgc}
    password: ${FGC_DB_PASSWORD:}
    hikari.maximum-pool-size: ${FGC_DB_POOL:5}
  flyway.enabled: true
  jackson:
    serialization.write-dates-as-timestamps: false
    # 원본 오프셋(+09:00 등)을 보존한다 (STEP1 D-3). 기본값 true 면 UTC 로 바뀌어 오프셋이 사라진다
    deserialization.adjust-dates-to-context-time-zone: false
    default-property-inclusion: always
  threads.virtual.enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true

fgc:
  jwt-secret: ${FGC_JWT_SECRET:}
  encryption-key: ${FGC_ENCRYPTION_KEY:}
  access-token-ttl: PT15M
  refresh-token-ttl: P30D
  retention-days: ${FGC_RETENTION_DAYS:730}
  sync:
    lookback: PT3H
    initial-backfill: P1D
    max-attempts: 3
  notion:
    base-url: ${NOTION_BASE_URL:https://api.notion.com}
    token: ${NOTION_TOKEN:}
    daily-database-id: ${NOTION_DAILY_DB_ID:}
    weekly-database-id: ${NOTION_WEEKLY_DB_ID:}
    version: "2022-06-28"
  fcm:
    credentials-path: ${FGC_FCM_CREDENTIALS:}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
